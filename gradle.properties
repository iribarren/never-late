# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent tasks (and independent test JVMs, via maxParallelForks in app/build.gradle.kts)
# concurrently instead of serially.
org.gradle.parallel=true

# Reuse outputs from previous builds/runs when inputs haven't changed.
org.gradle.caching=true

# Cap the Kotlin compile daemon. It is a separate JVM stacked on top of the Gradle daemon's own 2 GB
# and the forked test JVMs; left at its defaults it is the piece most likely to push a build into
# swap on a machine with only a few GB free.
kotlin.daemon.jvmargs=-Xmx1024m

# Kotlin code style.
kotlin.code.style=official

# gradle9-agp9-jdk25 migration note: android.useAndroidX and android.nonTransitiveRClass used to be
# set explicitly here. AGP 9 now assumes both as their only supported value (useAndroidX defaults
# to true as of AGP 9.0, and setting it to false is a build error; nonTransitiveRClass has defaulted
# to true since AGP 8.0), so the flags were removed rather than left as redundant no-ops.

# Explicitly NOT enabling the configuration cache (D6 of the gradle9-agp9-jdk25 spec): Gradle 9
# does not turn it on by default (that is planned for Gradle 10), and this migration is scoped to
# the AGP/Gradle/Kotlin/KSP/Hilt chain only — adopting the configuration cache with KSP + Hilt +
# Room behind it is its own feature, not a side effect of this one.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
